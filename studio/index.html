<title>RASOLV Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B0A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column (max 760px) between a sticky brand bar and a fixed thumb-reach tab bar; sheets rise from the bottom. */
:root {
  --bg: #0B0A09; --surface: #151311; --surface-2: #1E1B18; --line: #2C2824; --fg: #F5F0EB; --muted: #9C928A;
  --accent: #FF6E05; --accent-soft: rgba(255,110,5,.14); --on-accent: #120700;
  --ok: #3DD68C; --warn: #F5B83D; --err: #FF5A4E;
  --display: "Rubik", "Segoe UI", system-ui, sans-serif;
  --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px; --tabh: 64px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F8F5F1; --surface: #FFFFFF; --surface-2: #F0EBE5; --line: #E3DBD3; --fg: #16110D; --muted: #6E645C;
  --accent: #E35D00; --accent-soft: rgba(227,93,0,.10); --on-accent: #FFFFFF;
  --ok: #12935A; --warn: #A86A00; --err: #D2372B; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F8F5F1; --surface: #FFFFFF; --surface-2: #F0EBE5; --line: #E3DBD3; --fg: #16110D; --muted: #6E645C;
  --accent: #E35D00; --accent-soft: rgba(227,93,0,.10); --on-accent: #FFFFFF;
  --ok: #12935A; --warn: #A86A00; --err: #D2372B; color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.lock { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 10px; height: 54px; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; letter-spacing: .06em; font-size: 15px; }
.logo small { font-weight: 500; letter-spacing: .02em; color: var(--muted); font-size: 13px; }
.top .sp { flex: 1; }
.wrap { padding-block: 18px calc(var(--tabh) + 34px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabh); }
.tab { background: none; border: 0; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); position: relative; letter-spacing: .02em; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] svg { color: var(--accent); }
.tab .dot { position: absolute; top: 9px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.h1 { font-size: clamp(28px, 8vw, 40px); font-weight: 800; line-height: 1.04; letter-spacing: -.02em; }
.h1 em { font-style: normal; color: var(--accent); }
.h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.sec { display: grid; gap: 12px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.xl { min-height: 56px; font-size: 16px; border-radius: 16px; width: 100%; }
.btn.danger { color: var(--err); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 19px; height: 19px; }

.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 12px; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
textarea, input[type="text"], input[type="search"], input[type="datetime-local"], input[type="time"], select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
.composer textarea { background: transparent; border: 0; padding: 4px 2px; min-height: 104px; font-size: 17px; }
.composer textarea:focus { outline: none; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }

.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)); scroll-snap-type: x proximity; }
.scroller::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; min-height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.flowcard { flex: none; width: 210px; scroll-snap-align: start; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; display: grid; gap: 8px; }
.flowcard[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), transparent 70%), var(--surface); }
.flowcard b { font-size: 14px; }
.flowcard p { font-size: 12px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.agents { display: flex; gap: 3px; flex-wrap: wrap; }
.agents i { font-style: normal; font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.agents i.g { color: var(--warn); }

.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.tap { text-align: start; width: 100%; }
.card.tap:active { transform: scale(.995); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.running { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.pill.running::before { animation: pulse 1.1s ease-in-out infinite; }
.pill.review, .pill.scheduled { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pill.done, .pill.approved, .pill.posted { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.pill.error { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.plat { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; }

.banner { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
.banner svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.banner.hot { border-style: solid; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: var(--accent-soft); color: var(--fg); }
.empty { text-align: center; padding: 34px 16px; border: 1px dashed var(--line); border-radius: 18px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty .h2 { color: var(--fg); }

/* Run */
.runhead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.ap { display: block; }
.ap polygon { transition: fill .5s; }
.ap .lit { fill: var(--accent); }
.ap .off { fill: var(--surface-2); }
.ap .now { fill: var(--accent); animation: blade 1.2s ease-in-out infinite; }
.ap line { stroke: var(--bg); }
.steps { display: grid; gap: 0; position: relative; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.step::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step.done::before { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.sn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
.step.done .sn { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step.running .sn { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.review .sn { border-color: var(--warn); color: var(--warn); }
.step.error .sn { border-color: var(--err); color: var(--err); }
.sbody { min-width: 0; display: grid; gap: 8px; }
.shead { display: flex; align-items: center; gap: 8px; min-height: 30px; flex-wrap: wrap; background: none; border: 0; padding: 0; text-align: start; width: 100%; }
.shead b { font-size: 15px; }
.tag { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.out { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.out.collapsed { max-height: 132px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.thinking i { width: 54px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--surface-2), var(--accent), var(--surface-2)); background-size: 200% 100%; animation: shim 1.2s linear infinite; }
.gate { border: 1px solid color-mix(in srgb, var(--warn) 50%, var(--line)); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: color-mix(in srgb, var(--warn) 7%, transparent); }

/* Markdown */
.md > * + * { margin-top: .6em; }
.md h1, .md h2, .md h3, .md h4 { font-size: 15px; font-weight: 700; margin-top: 1em; }
.md h1:first-child, .md h2:first-child, .md h3:first-child { margin-top: 0; }
.md ul, .md ol { padding-inline-start: 1.25em; margin-bottom: 0; }
.md li + li { margin-top: .25em; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--surface-2); padding: 10px; border-radius: 10px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0; padding-inline-start: 10px; border-inline-start: 3px solid var(--accent); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md .tbl { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: start; vertical-align: top; }
.md th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* Pack */
.pack { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 20px; padding: 16px; display: grid; gap: 14px; background: linear-gradient(180deg, var(--accent-soft), transparent 220px), var(--surface); }
.score { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.gauge { width: 64px; height: 64px; }
.gauge .t { fill: none; stroke: var(--surface-2); stroke-width: 7; }
.gauge .v { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.gauge text { font-family: var(--display); font-weight: 800; font-size: 19px; fill: var(--fg); }
.post { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.post .hook { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.25; text-wrap: balance; }
.post .body { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.post .ar { direction: rtl; text-align: right; font-size: 15.5px; line-height: 1.75; border-top: 1px dashed var(--line); padding-top: 10px; white-space: pre-wrap; }
.tags { font-family: var(--mono); font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; }

/* Plan */
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)); }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 52px; height: 68px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; align-content: center; gap: 2px; position: relative; }
.day small { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.day b { font-family: var(--display); font-size: 19px; font-weight: 700; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day[aria-pressed="true"] small { color: inherit; opacity: .8; }
.day .pip { position: absolute; bottom: 7px; display: flex; gap: 2px; }
.day .pip i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.day[aria-pressed="true"] .pip i { background: var(--on-accent); }

.weekdays { display: flex; gap: 4px; flex-wrap: wrap; }
.weekdays button { width: 38px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; font-weight: 600; }
.weekdays button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.switch { width: 46px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--accent); }

/* Sheet */
#sheet { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: fade .2s; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: rise .26s cubic-bezier(.2,.8,.2,1); }
.panel::before { content: ""; width: 38px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.panel-h { display: flex; align-items: center; gap: 10px; }
@media (min-width: 720px) { .panel { left: 50%; right: auto; width: 640px; transform: translateX(-50%); bottom: 24px; border-radius: 22px; border-bottom: 1px solid var(--line); animation: fade .2s; } }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.35); animation: rise .2s; }
.toast a { color: inherit; font-weight: 700; }
.skel { height: 74px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface), var(--surface-2), var(--surface)); background-size: 200% 100%; animation: shim 1.4s linear infinite; }
.thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); }
.ideas { display: grid; gap: 8px; }
.idea { text-align: start; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0 2px; display: flex; gap: 12px; align-items: baseline; }
.idea span:first-child { font-family: var(--mono); font-size: 11px; color: var(--accent); flex: none; width: 56px; text-transform: uppercase; letter-spacing: .06em; }

@keyframes pulse { 50% { opacity: .25; } }
@keyframes blade { 50% { opacity: .35; } }
@keyframes shim { to { background-position: -200% 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 720px) { @keyframes rise { from { opacity: 0; } } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="top"><div class="top-in">
  <div class="logo" id="logo"></div>
  <div class="sp"></div>
  <button class="icon-btn" data-act="brand" aria-label="Brand profile" title="Brand profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16l-5.1 2.6 1-5.6-4.1-4 5.7-.8z"/></svg></button>
</div></header>

<main class="wrap" id="view"></main>

<div id="sheet" hidden></div>

<script>
"use strict";
/* ---------- basics ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o ?? null));

/* ---------- aperture mark (ported from the promo film's aperture()) ---------- */
const AP = (() => {
  const P = (a, rad) => [rad * Math.cos(a * Math.PI / 180), rad * Math.sin(a * Math.PI / 180)];
  const R = 80, r = 34, O = [...Array(6)].map((_, i) => P(-90 + 60 * i, R)), I = [...Array(6)].map((_, i) => P(-60 + 60 * i, r));
  const ang = q => (Math.atan2(q[1], q[0]) * 180 / Math.PI + 360) % 360;
  const hit = (p, d) => { let best = null;
    for (let k = 0; k < 6; k++) { const a = O[k], b = O[(k + 1) % 6], e = [b[0] - a[0], b[1] - a[1]], den = d[0] * e[1] - d[1] * e[0];
      if (Math.abs(den) < 1e-9) continue;
      const t = ((a[0] - p[0]) * e[1] - (a[1] - p[1]) * e[0]) / den, u = ((a[0] - p[0]) * d[1] - (a[1] - p[1]) * d[0]) / den;
      if (t > 1e-6 && u >= -1e-6 && u <= 1 + 1e-6 && (!best || t < best.t)) best = { t, q: [p[0] + t * d[0], p[1] + t * d[1]] }; }
    return best.q; };
  const Pt = I.map((q, i) => { const pr = I[(i + 5) % 6]; return hit(q, [q[0] - pr[0], q[1] - pr[1]]); });
  const f = q => q[0].toFixed(1) + "," + q[1].toFixed(1);
  const polys = [], seps = [];
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6, a0 = ang(Pt[i]), span = (ang(Pt[j]) - a0 + 360) % 360;
    const mids = O.filter(v => { const d = (ang(v) - a0 + 360) % 360; return d > 1e-3 && d < span - 1e-3; })
      .sort((u, v) => ((ang(v) - a0 + 360) % 360) - ((ang(u) - a0 + 360) % 360));
    polys.push([I[i], I[j], Pt[j], ...mids, Pt[i]].map(f).join(" "));
    seps.push(`<line x1="${I[i][0].toFixed(1)}" y1="${I[i][1].toFixed(1)}" x2="${Pt[i][0].toFixed(1)}" y2="${Pt[i][1].toFixed(1)}" stroke-width="5"/>`);
  }
  return { polys, seps };
})();
function aperture(size, lit = 6, now = -1) {
  return `<svg class="ap" width="${size}" height="${size}" viewBox="-84 -84 168 168" aria-hidden="true">${AP.polys.map((p, i) =>
    `<polygon points="${p}" class="${i === now ? "now" : i < lit ? "lit" : "off"}"/>`).join("")}${AP.seps.join("")}</svg>`;
}
function runBlades(run) {
  const n = run.steps.length, done = run.steps.filter(s => s.status === "done").length;
  const lit = Math.round(done / n * 6), active = run.steps.some(s => s.status === "running") ? Math.min(5, lit) : -1;
  return { lit, active };
}

/* ---------- markdown (escaped first, then a small safe subset) ---------- */
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = esc(src).split("\n"); let out = "", i = 0;
  const isTable = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    let l = lines[i];
    if (/^\s*```/.test(l)) { let code = ""; i++; while (i < lines.length && !/^\s*```/.test(lines[i])) code += lines[i++] + "\n"; i++; out += `<pre><code>${code}</code></pre>`; continue; }
    if (isTable(l)) { const rows = []; while (i < lines.length && isTable(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      const [h, ...rest] = body;
      out += `<div class="tbl"><table><thead><tr>${cells(h || "").map(c => `<th dir="auto">${c}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td dir="auto">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(4, m[1].length + 1); out += `<h${n} dir="auto">${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (/^\s*&gt;\s?/.test(l)) { let q = []; while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^\s*&gt;\s?/, "")); out += `<blockquote dir="auto">${inline(q.join("<br>"))}</blockquote>`; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) { const ordered = /^\s*\d/.test(l); let items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      out += `<${ordered ? "ol" : "ul"} dir="auto">${items.map(t => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`; continue; }
    if (!l.trim()) { i++; continue; }
    let p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*```|\s*([-*•]|\d+[.)])\s+|\s*&gt;)/.test(lines[i]) && !isTable(lines[i])) p.push(lines[i++]);
    if (!p.length) { p.push(lines[i++]); }
    out += `<p dir="auto">${inline(p.join("<br>"))}</p>`;
  }
  return `<div class="md">${out}</div>`;
}

function ago(t) { const s = (Date.now() - t) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; }
const pad = n => String(n).padStart(2, "0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = d => localISO(d).slice(0, 10);
function fmtWhen(iso) { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
function nextFromBest(best, after) {
  const m = String(best || "").match(/(sun|mon|tue|wed|thu|fri|sat)[a-z]*\.?\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if (!m) return null;
  let h = +m[2]; const min = +(m[3] || 0), ap = (m[4] || "").toLowerCase();
  if (ap === "pm" && h < 12) h += 12; if (ap === "am" && h === 12) h = 0;
  const target = DOW.findIndex(d => d.toLowerCase() === m[1].slice(0, 3).toLowerCase());
  const d = new Date(after); d.setHours(h, min, 0, 0);
  let add = (target - d.getDay() + 7) % 7; if (add === 0 && d <= after) add = 7;
  d.setDate(d.getDate() + add); return localISO(d);
}

async function save(run) { run.updatedAt = Date.now(); LOCALRUN[run.id] = run; render(); return put(COL.runs, run).catch(() => {}); }
async function drive(runId) {

  LOCALRUN[runId] = run;
  run.status = "running";
  LIVE[runId] = { text: "" };
  try {
    for (let i = 0; i < run.steps.length; i++) {
      const s = run.steps[i];
      if (s.status === "done") continue;
      if (s.status === "review") { run.status = "review"; break; }
      s.status = "running"; s.startedAt = Date.now(); s.error = "";
      const ctl = new AbortController(); LIVE[runId] = { ctl, stepId: s.id, text: "" };
      await save(run);
      const firstAgent = run.steps.findIndex(x => x.role !== "packager");
      const img = i === firstAgent ? IMAGES[runId] : null;
      try {
        if (s.role === "packager") {
          const pack = await SAMPLE.json(packPrompt(run, i), { modelTier: s.tier, signal: ctl.signal, cache: false,
            onText: ({ text }) => { LIVE[runId].text = text; paintLive(runId); } });
          if (!pack || !Array.isArray(pack.items)) throw { code: "invalid_json" };
          run.pack = normalizePack(pack);
          s.output = `**${run.pack.title}**\n\n${run.pack.summary}\n\n${run.pack.items.length} posts packaged · predicted score ${run.pack.score}/100`;
        } else {
          const opts = { modelTier: s.tier, signal: ctl.signal, cache: false, onText: ({ text }) => { LIVE[runId].text = text; paintLive(runId); } };
          if (img) opts.images = [img];
          const res = await SAMPLE(agentPrompt(run, i, !!img), opts);
          s.output = res.text + (res.truncated ? "\n\n*(cut short at the length limit)*" : "");

        if (s.gate) { run.status = "review"; LIVE[runId] = null; await save(run); toast(`${esc(s.name)} is waiting for your review`); return; }
      } catch (e) {
        if (e && e.code === "cancelled") { s.status = "pending"; s.output = ""; run.status = "stopped"; await save(run); return; }
        s.status = "error"; s.error = sampleErr(e); if (e && e.text) s.output = e.text;
        run.status = "error"; await save(run); return;

    await save(run);

function normalizePack(p) {

      hashtags: Array.isArray(it.hashtags) ? it.hashtags.map(str).slice(0, 8) : [], cta: str(it.cta), visual: str(it.visual), bestTime: str(it.bestTime) })) };
}
let paintQ = {};
function paintLive(runId) {

  for (let back = 0; back < 8; back++) { const d = new Date(now); d.setDate(d.getDate() - back); d.setHours(...(a.time || "07:00").split(":").map(Number), 0, 0);
    if ((a.days || []).includes(d.getDay()) && d <= now) return d.getTime(); }
  return 0;
}

async function calendarEvent(x) {

  saveItem: async el => { const r = runById(el.dataset.run); const it = r.pack.items.find(x => x.id === el.dataset.item); await put(COL.library, toLib(r, it)); toast("Saved to Library"); },
  saveAll: async el => { const r = runById(el.dataset.id); let n = 0; for (const it of r.pack.items) if (!S.library.some(x => x.packItemId === it.id)) { await put(COL.library, toLib(r, it)).catch(() => {}); n++; } toast(n ? `${n} posts saved to Library` : "Already saved"); },
  scheduleAll: async el => { const r = runById(el.dataset.id); let n = 0, t = new Date(), fallback = new Date(); fallback.setDate(fallback.getDate() + 1); fallback.setHours(18, 0, 0, 0);
    for (const it of r.pack.items) { if (S.library.some(x => x.packItemId === it.id)) continue;
      const when = nextFromBest(it.bestTime, t) || localISO(fallback); fallback.setDate(fallback.getDate() + 1); await put(COL.library, toLib(r, it, when)).catch(() => {}); n++; }
    toast(n ? `${n} posts scheduled · see Plan` : "Already saved. Set times from Library."); },
  emailPack: el => { const r = runById(el.dataset.id); gmailDraft(`${S.brand?.name || "Content"} · ${r.pack.title}`, packText(r)); },
  libFilter: el => { S.libFilter = el.dataset.v; render(true); },
  libStatus: el => { S.libFilter = el.dataset.v; go("library"); },
  openItem: el => itemSheet(el.dataset.id),
  saveItem2: async el => { const x = readItemSheet(el.dataset.id); if (!x) return; await put(COL.library, x); closeSheet(); toast("Saved"); },
  copyLib: el => { copy(postText({ hook: $("#it-hook").value, body: $("#it-body").value, hashtags: $("#it-tags").value.split(/\s+/).filter(Boolean) })); },
  copyLibAr: () => copy($("#it-ar").value),
  calItem: el => { const x = readItemSheet(el.dataset.id); if (x) calendarEvent(x); },
  mailItem: el => { const x = readItemSheet(el.dataset.id); if (x) gmailDraft(`${x.platform} post · ${(x.hook || "").slice(0, 60)}`, postText(x) + (x.bodyAr ? "\n\n" + x.bodyAr : "")); },
  delItem: async el => { if (!armed("del" + el.dataset.id, el, "Tap again")) return; await del(COL.library, el.dataset.id); closeSheet(); toast("Deleted"); },
  polish: async el => {
    const kind = el.dataset.v, body = $("#it-body").value, hook = $("#it-hook").value, chips = $$("[data-act=polish]");
    const ask = { punchy: "Rewrite this post to be punchier and more vivid. Same facts, same platform conventions. Reply with only the new post text.",
      short: "Cut this post to about half its length, keeping the strongest line. Reply with only the new post text.",
      hook: "Write one new scroll-stopping opening hook (under 9 words) for this post. Reply with only the hook.",
      ar: "Adapt this post into natural Modern Standard Arabic (not literal translation), keeping the brand's Arabic name and Western digits. Reply with only the Arabic text." }[kind];
    chips.forEach(c => c.disabled = true); const old = el.textContent; el.textContent = "Working…";
    try {
      const { text } = await SAMPLE(`${brandBlock(S.brand)}\n\n## Post (${$("#sheet .panel-h h2").textContent})\nHook: ${hook}\n\n${body}\n\n## Task\n${ask}`, { modelTier: kind === "hook" ? "quick" : "default", cache: false });
      const target = kind === "hook" ? $("#it-hook") : kind === "ar" ? $("#it-ar") : $("#it-body");
      if (target) target.value = text.trim().replace(/^"|"$/g, "");
      toast("Updated. Save to keep it.");
    } catch (e) { if (e?.code !== "cancelled") toast(esc(sampleErr(e))); }
    finally { chips.forEach(c => c.disabled = false); el.textContent = old; }
  },
  planDay: el => { S.planDay = el.dataset.v; render(true); },
  planWeek: el => { const f = flowById(el.dataset.id); startRun(f, `Plan and write next week's content (starting tomorrow, ${new Date(Date.now() + 864e5).toDateString()}). Balance the brand pillars; include at least one bilingual post.`, S.platforms.length ? S.platforms.slice() : ["Instagram", "LinkedIn"], S.lang, null); },
  saveBrand: async () => { const k = ["name", "nameAr", "oneLiner", "voice", "audience", "pillars", "tagline", "avoid", "notes"]; const b = {}; k.forEach(x => b[x] = $("#b-" + x).value.trim()); b.updatedAt = Date.now();
    await putDoc("config/brand", b).catch(() => {}); closeSheet(); toast("Brand saved. Agents will use it from the next step."); },
  newFlow: () => flowSheet(null),
  editFlow: el => flowSheet(flowById(el.dataset.id)),
  stepMove: el => { SHEET.read(); const i = +el.dataset.i, j = i + +el.dataset.d; const st = SHEET.f.steps; [st[i], st[j]] = [st[j], st[i]]; SHEET.draw(); },
  stepDel: el => { SHEET.read(); if (SHEET.f.steps.length < 2) return; SHEET.f.steps.splice(+el.dataset.i, 1); SHEET.draw(); },
  stepAdd: () => { SHEET.read(); const st = SHEET.f.steps, at = st.length && st[st.length - 1].role === "packager" ? st.length - 1 : st.length; st.splice(at, 0, { id: uid(), name: "Agent", role: "agent", tier: "default", gate: false, instructions: "" }); SHEET.draw(); },
  saveFlow: async () => { SHEET.read(); const f = SHEET.f; if (!f.name) { toast("Give the flow a name."); $("#fl-name").focus(); return; } await put(COL.flows, f); closeSheet(); toast("Flow saved"); },
  dupFlow: async () => { SHEET.read(); const f = clone(SHEET.f); f.id = "f-" + uid(); f.name += " copy"; f.createdAt = Date.now(); f.order = S.flows.length; f.steps.forEach(s => s.id = uid()); await put(COL.flows, f); closeSheet(); toast("Duplicated"); },
  delFlow: async el => { if (!armed("delf", el, "Tap again to delete")) return; await del(COL.flows, SHEET.f.id); closeSheet(); toast("Flow deleted"); },
  designFlow: async el => {
    const idea = $("#flowIdea").value.trim(); if (!idea) { toast("Describe the workflow you want."); $("#flowIdea").focus(); return; }
    el.disabled = true; el.innerHTML = `${ic("spark")}Designing…`;
    try {
      const out = await SAMPLE.json(`Design a content-production pipeline of AI agents for this need:\n"${idea}"\n\n${brandBlock(S.brand)}\n\nEach agent receives the brief and all earlier agents' work, and writes Markdown. 3 to 6 agents. Put a review gate on the one step where a human's approval matters most. The last step must be a packager (role "packager") that outputs ready-to-post content. Reply with only JSON: {"name":"2-3 word name","description":"one line","steps":[{"name":"Agent name","role":"agent","tier":"default|complex|quick","gate":false,"instructions":"2-4 precise sentences: what this agent does and what it outputs"}]}`, { modelTier: "default", cache: false });
      if (!out || !Array.isArray(out.steps) || !out.steps.length) throw { code: "invalid_json" };
      const steps = out.steps.slice(0, 8).map(s => ({ id: uid(), name: String(s.name || "Agent"), role: s.role === "packager" ? "packager" : "agent", tier: TIERS[s.tier] ? s.tier : "default", gate: !!s.gate, instructions: String(s.instructions || "") }));
      if (steps[steps.length - 1].role !== "packager") steps.push({ id: uid(), name: "Packager", role: "packager", tier: "default", gate: false, instructions: "" });
      flowSheet({ id: "f-" + uid(), name: String(out.name || "New flow"), description: String(out.description || ""), createdAt: Date.now(), order: S.flows.length, steps });
      toast("Review the design, then save it.");
    } catch (e) { if (e?.code !== "cancelled") toast(esc(sampleErr(e))); }
    finally { el.disabled = false; el.innerHTML = `${ic("spark")}Design it`; }
  },
  newAuto: () => autoSheet(null),
  editAuto: el => autoSheet(S.autos.find(a => a.id === el.dataset.id)),
  auDay: el => { const i = +el.dataset.i, d = SHEET.x.days; SHEET.x.days = d.includes(i) ? d.filter(x => x !== i) : [...d, i].sort(); SHEET.draw(); },
  auPlat: el => { const p = el.dataset.v, a = SHEET.x.platforms; SHEET.x.platforms = a.includes(p) ? a.filter(x => x !== p) : [...a, p]; SHEET.draw(); },
  auLang: el => { SHEET.x.lang = el.dataset.v; SHEET.draw(); },
  saveAuto: async () => { SHEET.read(); const x = SHEET.x; if (!x.brief) { toast("Write the brief this autopilot should run."); return; } if (!x.days.length) { toast("Pick at least one day."); return; } if (SHEET.isNew) x.lastRunAt = Date.now();
    await put(COL.autos, x); closeSheet(); toast("Autopilot saved"); },
  delAuto: async el => { if (!armed("dela", el, "Tap again to delete")) return; await del(COL.autos, SHEET.x.id); closeSheet(); toast("Deleted"); },
  toggleAuto: el => { const a = clone(S.autos.find(x => x.id === el.dataset.id)); a.enabled = !a.enabled; if (a.enabled) a.lastRunAt = Date.now(); put(COL.autos, a); },
  runAuto: el => runAuto(S.autos.find(a => a.id === el.dataset.id)),
  runDue: () => { const d = dueAutos(); d.slice(0, 2).forEach(runAuto); }
};
async function runAuto(a) {
  const f = flowById(a.flowId); if (!f) return;
  const x = clone(a); x.lastRunAt = Date.now(); await put(COL.autos, x).catch(() => {});
  startRun(f, `${a.brief}\n\n(Autopilot "${a.name}", ${new Date().toDateString()})`, a.platforms?.length ? a.platforms : ["Instagram"], a.lang || "both", null);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => {
  if (e.target.id === "brief") { S.brief = e.target.value; store.set("brief", S.brief); }
  if (e.target.id === "libQ") { S.libQuery = e.target.value; clearTimeout(window._lq); window._lq = setTimeout(() => { const pos = e.target.selectionStart; render(true); const q = $("#libQ"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch {} } }, 180); }
});
document.addEventListener("change", e => {
  if (e.target.id === "imgIn" && e.target.files[0]) { const f = e.target.files[0]; if (S.imageURL) URL.revokeObjectURL(S.imageURL); S.image = f; S.imageURL = URL.createObjectURL(f); render(true); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ---------- boot ---------- */
$("#logo").innerHTML = `${aperture(26)}<span>RASOLV <small>Studio</small></span>`;
{ const h = (location.hash || "").slice(1); if (TABS.some(t => t[0] === h)) S.tab = h; }
render(true);
setInterval(() => { if (!document.hidden && $("#sheet").hidden) render(); }, 60000);
(async () => {
  const C = window.claude;
  if (!C || !C.use) { MEMORY = true; SAMPLE_CHECKED = true; Object.assign(S.ready, { flows: true, runs: true, library: true, autos: true, brand: true }); render(true); return; }
  const [db, sample, mcp] = await Promise.all([C.use("db").catch(() => null), C.use("sample").catch(() => null), C.use("mcp").catch(() => null)]);
  SAMPLE = sample; MCP = mcp; SAMPLE_CHECKED = true;
  if (sample) { try { const lim = await sample.limits(); CAN_IMG = !!lim.images; } catch {} }
  if (db) { DB = db; subscribe(); }
  else { MEMORY = true; Object.assign(S.ready, { flows: true, runs: true, library: true, autos: true, brand: true }); }
  render(true);
})();
</script>
