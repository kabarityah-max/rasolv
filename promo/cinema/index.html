<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rasolv Cinema</title>
<style>
  @font-face { font-family: 'Rubik'; src: url('../fonts/Rubik.woff2') format('woff2'); font-weight: 300 900; }
  :root { --or: #FF6E05; --or2: #FF9A3D; --tx: #EDEDED; --dim: rgba(237,237,237,.42); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: 'Rubik', sans-serif; -webkit-font-smoothing: antialiased; color: var(--tx); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 70% 70% at 50% 50%, #0d0d0d 0%, #060606 60%, #020202 100%); }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #grain { opacity: .07; mix-blend-mode: screen; }
  #vig { background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 55%, rgba(0,0,0,.75) 100%); }

  /* hook */
  #hook { font-size: 58px; font-weight: 500; letter-spacing: -1.2px; white-space: nowrap; display: flex; gap: 16px; }
  #hook span { display: inline-block; }
  #phone { width: 150px; height: 300px; border-radius: 30px; background: linear-gradient(150deg, #2a2a2a 0%, #0c0c0c 45%, #050505 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.10), inset 2px 2px 0 rgba(255,255,255,.12), 0 30px 60px rgba(0,0,0,.6), -8px 0 30px rgba(255,110,5,.10); overflow: hidden; }
  #phone::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 45%, transparent 55%); }
  #phoneScreen { position: absolute; inset: 10px; border-radius: 22px; background: radial-gradient(circle at 50% 40%, #1b1208, #070707 70%); display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 12px; padding: 18px; }
  #phoneScreen i { width: 40px; height: 40px; border-radius: 12px; background: #161616; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; }
  #phoneScreen i svg { width: 22px; height: 22px; }

  /* beams + logo */
  .beam { width: 2600px; height: 26px; border-radius: 13px; background: linear-gradient(90deg, transparent 0%, rgba(255,110,5,.0) 10%, rgba(255,140,50,.9) 50%, rgba(255,110,5,0) 90%, transparent 100%); filter: blur(3px); mix-blend-mode: screen; }
  .beam::after { content: ''; position: absolute; inset: -30px 0; background: inherit; filter: blur(30px); opacity: .7; }
  #logoMain { width: 340px; height: 340px; }
  #logoSub { font-size: 30px; font-weight: 400; color: rgba(237,237,237,.7); white-space: nowrap; letter-spacing: .3px; }

  /* sphere */
  #sphere { width: 1900px; height: 1900px; border-radius: 50%;
    background: radial-gradient(circle at 50% 18%, rgba(255,255,255,.07), transparent 38%), radial-gradient(circle at 50% 50%, #090909 58%, #121212 80%, #1d1d1d 92%, #060606 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.07), inset 0 40px 120px rgba(255,255,255,.07), 0 -20px 120px rgba(255,110,5,.06); }
  #sphere::before { content: ''; position: absolute; inset: 0; border-radius: 50%; padding: 5px;
    background: conic-gradient(from -60deg, transparent 0deg, rgba(255,255,255,.55) 30deg, rgba(255,170,110,.35) 60deg, transparent 110deg, transparent 230deg, rgba(255,255,255,.25) 290deg, transparent 340deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; filter: blur(1.5px); }
  #sphere::after { content: ''; position: absolute; inset: -40px; border-radius: 50%; background: conic-gradient(from -60deg, transparent 0deg, rgba(255,255,255,.10) 40deg, transparent 100deg); filter: blur(40px); }
  #shaft { width: 6px; height: 760px; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.55) 40%, rgba(255,200,150,.25) 70%, rgba(255,255,255,0)); filter: blur(2px); }
  #shaft::after { content: ''; position: absolute; left: -60px; right: -60px; top: 0; bottom: 0; background: inherit; filter: blur(40px); opacity: .5; }
  .orb { width: 70px; height: 70px; border-radius: 22px; background: rgba(20,20,20,.9); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 12px 30px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .orb svg { width: 36px; height: 36px; }
  #reticle { width: 120px; height: 120px; }

  /* chips */
  .chip { height: 66px; padding: 0 26px; border-radius: 14px; display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 29px; font-weight: 400;
    background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); color: var(--tx); }
  .chip.icon { width: 66px; padding: 0; justify-content: center; }
  .chip.icon svg { width: 32px; height: 32px; }
  .chip b { font-weight: 600; }

  /* ring word */
  #ringWord { width: 380px; height: 380px; }
  #ringWord svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #ringTxt { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 46px; font-weight: 500; white-space: nowrap; }
  .dotp { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 18px rgba(255,255,255,.9); }
  #sq { width: 1920px; height: 1080px; }

  /* trusted */
  #trust { font-size: 62px; font-weight: 500; letter-spacing: -1.5px; text-align: center; line-height: 1.12; white-space: nowrap; }
  #trust em { font-style: normal; color: var(--or); }
  .ind { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 600; color: rgba(237,237,237,.55); white-space: nowrap; letter-spacing: -.4px; }
  .ind svg { width: 44px; height: 44px; }

  /* beats */
  #bigBlur { font-size: 560px; font-weight: 700; letter-spacing: -20px; color: rgba(255,255,255,.12); white-space: nowrap; }
  #beat { font-size: 120px; font-weight: 500; letter-spacing: -3px; white-space: nowrap; }
  .lt { font-size: 120px; font-weight: 500; }
  #bigRing { width: 900px; height: 900px; border-radius: 50%; border: 26px solid #fff; box-shadow: 0 0 60px rgba(255,255,255,.6), inset 0 0 60px rgba(255,255,255,.5), 0 0 160px rgba(255,140,60,.4); }
  #ring2 { width: 520px; height: 520px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); box-shadow: 0 0 40px rgba(255,255,255,.2); }
  .comet { width: 120px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, transparent, #fff); filter: blur(1px); }

  /* glitch + wordmark */
  .gl { width: 380px; height: 380px; mix-blend-mode: screen; }
  #wm { display: flex; align-items: center; gap: 38px; }
  #wm svg { width: 120px; height: 120px; flex: none; }
  #wmTxt { font-size: 96px; font-weight: 500; white-space: nowrap; color: #fff; }
  #wmTag { font-size: 24px; font-weight: 400; letter-spacing: 12px; color: rgba(237,237,237,.6); white-space: nowrap; }

  #cursor { width: 40px; height: 40px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); z-index: 40; }
  #cap { z-index: 50; font-size: 35px; font-weight: 400; letter-spacing: .2px; white-space: nowrap; display: flex; gap: 10px; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  #cap span { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="sphere" class="abs"></div>
  <div id="shaft" class="abs"></div>

  <div id="hook" class="abs"></div>
  <div id="phone" class="abs"><div id="phoneScreen"></div></div>

  <div id="beams"></div>
  <svg id="logoMain" class="abs" viewBox="-110 -110 220 220"></svg>
  <div id="logoSub" class="abs">support that sees the whole picture</div>

  <div id="orbs"></div>
  <svg id="reticle" class="abs" viewBox="-60 -60 120 120"><circle r="34" fill="none" stroke="#fff" stroke-width="3"/><path d="M0-50v14M0 36v14M-50 0h14M36 0h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>

  <div id="chips"></div>

  <div id="dots"></div>
  <svg id="sq" class="abs" viewBox="0 0 1920 1080"><polyline id="sqLine" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5"/></svg>
  <div id="ringWord" class="abs"><svg viewBox="-200 -200 400 400"><circle r="168" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/><circle id="ringArc" r="168" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" style="filter:drop-shadow(0 0 10px #fff)"/><g id="ringDots"></g></svg><div id="ringTxt">no one waits.</div></div>

  <div id="trust" class="abs">Trusted by teams that<br>can’t afford to <em>wait</em></div>
  <div id="inds"></div>

  <div id="bigBlur" class="abs">RASOLV</div>
  <div id="bigRing" class="abs"></div>
  <div id="ring2" class="abs"></div>
  <div id="comets"></div>
  <div id="beat" class="abs"></div>
  <div id="letters"></div>

  <svg id="glR" class="gl abs" viewBox="-110 -110 220 220"></svg>
  <svg id="glG" class="gl abs" viewBox="-110 -110 220 220"></svg>
  <svg id="glB" class="gl abs" viewBox="-110 -110 220 220"></svg>
  <svg id="glW" class="gl abs" viewBox="-110 -110 220 220"></svg>
  <div id="wm" class="abs"><svg id="wmLogo" viewBox="-110 -110 220 220"></svg><div id="wmTxt">RASOLV</div></div>
  <div id="wmTag" class="abs">VISION THAT SOLVES</div>

  <svg id="cursor" class="abs" viewBox="0 0 32 32"><path d="M6 3v23l6.2-5.8 4.1 9 4-1.8-4-8.8H25z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div id="vig" class="layer"></div>
  <div id="grain" class="layer"></div>
  <div id="cap" class="abs"></div>
</div>

<script src="captions.js"></script>
<script>
// ================= helpers =================
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: k => 1 - Math.pow(1 - k, 3), inCubic: k => k * k * k,
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outExpo: k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k), inExpo: k => k === 0 ? 0 : Math.pow(2, 10 * k - 10),
  inOutExpo: k => k === 0 ? 0 : k === 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outQuint: k => 1 - Math.pow(1 - k, 5),
};
function io(t, a, b, c, d, { blurIn = 18, blurOut = 18, ein = E.outCubic, eout = E.inCubic } = {}) {
  const ki = ein(prog(t, a, b)), ko = eout(prog(t, c, d));
  return { k: ki, out: ko, o: clamp(prog(t, a, b) * 1.6) * (1 - ko), blur: lerp(blurIn, 0, ki) + lerp(0, blurOut, ko) };
}
function S(el, o) {
  if (typeof el === 'string') el = $(el);
  const s = el.style;
  s.display = '';
  s.opacity = o.o ?? 1;
  s.left = (o.x ?? 960) + 'px'; s.top = (o.y ?? 540) + 'px';
  s.transform = `translate(-50%, -50%) ${o.tf || ''} scale(${o.s ?? 1})`;
  s.filter = o.blur > 0.05 ? `blur(${o.blur.toFixed(2)}px)` : 'none';
}
const MANAGED = [];
function hideAll() { for (const el of MANAGED) el.style.display = 'none'; }
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

// ================= RASOLV aperture mark =================
function aperture({ r = 37, rot = 0, bp = 1, grow = 1, color = '#FF6E05', gap = '#000', R = 80, lines = true } = {}) {
  const P = (a, rad) => [rad * Math.cos(a * Math.PI / 180), rad * Math.sin(a * Math.PI / 180)];
  const O = [...Array(6)].map((_, i) => P(-90 + 60 * i, R));
  const I = [...Array(6)].map((_, i) => P(-60 + 60 * i + rot, Math.max(r, 0.01)));
  const ang = q => (Math.atan2(q[1], q[0]) * 180 / Math.PI + 360) % 360;
  const hit = (p, d) => {
    let best = null;
    for (let k = 0; k < 6; k++) {
      const a = O[k], b = O[(k + 1) % 6], e = [b[0] - a[0], b[1] - a[1]];
      const den = d[0] * e[1] - d[1] * e[0]; if (Math.abs(den) < 1e-9) continue;
      const t = ((a[0] - p[0]) * e[1] - (a[1] - p[1]) * e[0]) / den;
      const u = ((a[0] - p[0]) * d[1] - (a[1] - p[1]) * d[0]) / den;
      if (t > 1e-6 && u >= -1e-6 && u <= 1 + 1e-6 && (!best || t < best.t)) best = { t, q: [p[0] + t * d[0], p[1] + t * d[1]] };
    }
    return best.q;
  };
  const Pt = I.map((q, i) => { const pr = I[(i + 5) % 6]; return hit(q, [q[0] - pr[0], q[1] - pr[1]]); });
  const f = q => q[0].toFixed(2) + ',' + q[1].toFixed(2);
  let blades = '', seps = '';
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6, a0 = ang(Pt[i]), span = (ang(Pt[j]) - a0 + 360) % 360;
    const mids = O.filter(v => { const d = (ang(v) - a0 + 360) % 360; return d > 1e-3 && d < span - 1e-3; })
                  .sort((u, v) => ((ang(v) - a0 + 360) % 360) - ((ang(u) - a0 + 360) % 360));
    const poly = [I[i], I[j], Pt[j], ...mids, Pt[i]];
    const c = poly.reduce((m, q) => [m[0] + q[0] / poly.length, m[1] + q[1] / poly.length], [0, 0]);
    const g = 0.6 + 0.4 * clamp(grow * 1.6 - i * 0.12);
    const o = clamp(grow * 2 - i * 0.18);
    blades += `<polygon points="${poly.map(f).join(' ')}" fill="${color}" opacity="${o}" transform="translate(${f(c)}) scale(${g}) translate(${f([-c[0], -c[1]])})"/>`;
    seps += `<line x1="${f(I[i]).replace(',', '" y1="')}" x2="${f(Pt[i]).replace(',', '" y2="')}" stroke="${gap}" stroke-width="4.2" stroke-linecap="square"/>`;
    if (lines && (i === 0 || i === 3)) {
      const s0 = [I[i][0] + (I[j][0] - I[i][0]) * 0.55, I[i][1] + (I[j][1] - I[i][1]) * 0.55];
      const d = [Pt[i][0] - I[i][0], Pt[i][1] - I[i][1]];
      seps += `<line x1="${s0[0] + d[0] * 0.08}" y1="${s0[1] + d[1] * 0.08}" x2="${s0[0] + d[0] * 0.62}" y2="${s0[1] + d[1] * 0.62}" stroke="${gap}" stroke-width="3.6"/>`;
    }
    if (lines && (i === 1 || i === 4))
      seps += `<line x1="${f(I[j]).replace(',', '" y1="')}" x2="${f(O[(i + 2) % 6]).replace(',', '" y2="')}" stroke="${gap}" stroke-width="0.9"/>`;
  }
  let bpS = '';
  if (bp > 0) {
    for (let k = 0; k < 6; k++) {
      const a = O[k], b = O[(k + 1) % 6], e = [b[0] - a[0], b[1] - a[1]], L = Math.hypot(...e);
      const n = [e[1] / L, -e[0] / L]; const off = 13; const kk = clamp(bp * 1.4 - k * 0.07);
      const a1 = [a[0] + n[0] * off + e[0] * 0.08, a[1] + n[1] * off + e[1] * 0.08];
      const b1 = [a1[0] + e[0] * 0.84 * kk, a1[1] + e[1] * 0.84 * kk];
      const tick = (q, s) => `<line x1="${q[0] - n[0] * 4 * s}" y1="${q[1] - n[1] * 4 * s}" x2="${q[0] + n[0] * 4 * s}" y2="${q[1] + n[1] * 4 * s}"/>`;
      bpS += `<line x1="${f(a1).replace(',', '" y1="')}" x2="${f(b1).replace(',', '" y2="')}"/>` + tick(a1, kk) + tick(b1, kk);
      const ra = P(-90 + 60 * k, R + 6), rb = P(-90 + 60 * k, R + 6 + 12 * kk);
      bpS += `<line x1="${f(ra).replace(',', '" y1="')}" x2="${f(rb).replace(',', '" y2="')}"/>`;
    }
    bpS = `<g stroke="${color}" stroke-width="1.3" fill="none" opacity="${clamp(bp * 3)}">${bpS}</g>`;
  }
  return bpS + `<g>${blades}${seps}</g>`;
}
const apCache = {};
function setAp(el, opts) {
  const key = JSON.stringify(opts, (k, v) => typeof v === 'number' ? +v.toFixed(3) : v);
  if (el.dataset.k === key) return;
  el.dataset.k = key; el.innerHTML = apCache[key] ??= aperture(opts);
}

// ================= icons =================
const I = {
  mail: c => `<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="${c}" stroke-width="1.9"/><path d="M4 7l8 6 8-6" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/></svg>`,
  chat: c => `<svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/></svg>`,
  wa: c => `<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .9c-1-.5-2-1.5-2.5-2.5l.9-1-1-2z" fill="${c}"/></svg>`,
  phone: c => `<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/></svg>`,
  hash: c => `<svg viewBox="0 0 24 24"><path d="M9 3 7 21M17 3l-2 18M4 8.5h17M3 15.5h17" stroke="${c}" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  bug: c => `<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5" fill="none" stroke="${c}" stroke-width="1.9"/><path d="M12 11v9M3 13h4M17 13h4M4 7l3 2M20 7l-3 2M4 19l3-2M20 19l-3-2" stroke="${c}" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  star: c => `<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.5 6 .7-4.5 4.1 1.2 6L12 16.8 6.7 19.8l1.2-6-4.5-4.1 6-.7z" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/></svg>`,
  check: c => `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-width="1.8"/><path d="M8 12.5l2.7 2.7L16 9.8" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  bolt: c => `<svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L10 22l9-12.5h-6z" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  doc: c => `<svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M9 13h7M9 17h5" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  cart: c => `<svg viewBox="0 0 24 24"><path d="M3 4h3l2.4 11h10.2L21 7H7" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/><circle cx="10" cy="19.5" r="1.6" fill="${c}"/><circle cx="17" cy="19.5" r="1.6" fill="${c}"/></svg>`,
  cloud: c => `<svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/></svg>`,
  bank: c => `<svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  tower: c => `<svg viewBox="0 0 24 24"><path d="M12 9v12M8 21l4-12 4 12M7 5a7 7 0 0 0 0 8M17 5a7 7 0 0 1 0 8M9.5 7a3.5 3.5 0 0 0 0 4M14.5 7a3.5 3.5 0 0 1 0 4" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  plane: c => `<svg viewBox="0 0 24 24"><path d="M10 14l-7-2.5L4.5 10l6.5 1 4-6.5c.8-1.2 2.6-.8 2.6.6L16 12l5 2-1 2-6-1-3 5h-2l1-5z" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  heart: c => `<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.5-7.5-10A4.2 4.2 0 0 1 12 7.5 4.2 4.2 0 0 1 19.5 10C19.5 15.5 12 20 12 20z" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 12h2.5l1-2 2 4 1-2H16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
};

// ================= data =================
const HOOK1 = [['What', 0.5], ['if', 0.73], ['support', 0.95, 1], ['wasn’t', 1.32], ['a', 1.54], ['waiting', 1.77], ['game…', 2.14]];
const HOOK2 = [['but', 4.4], ['a', 4.62], ['system', 4.84], ['that', 5.19], ['solves?', 5.41, 1]];
const ORBS = ['mail', 'chat', 'wa', 'phone', 'hash', 'bug', 'star'];
// keyword chips: [text, x, y, appear, hot-time]
const KEYS = [
  ['channel', 640, 300, 14.45], ['language', 1050, 300, 14.6], ['customer value', 1420, 300, 14.75],
  ['intent', 760, 420, 14.9, 16.32], ['sentiment', 1060, 420, 15.05, 17.01], ['SLA clock', 1370, 420, 15.2],
  ['product area', 560, 540, 15.35], ['history', 860, 540, 15.5, 17.63], ['urgency', 1130, 540, 15.65, 18.2], ['tone', 1360, 540, 15.8],
  ['past fixes', 760, 660, 15.95], ['root cause', 1080, 660, 16.1],
];
// metric chips: [kind, text|icon, x, y, appear, value0, value1, fmt]
const METRICS = [
  ['icon', 'check', 1240, 300, 19.55], ['m', 'first response', 1470, 300, 19.6, 0, 62, v => `<b>−${v}%</b> first response`],
  ['m', 'csat', 630, 420, 19.75, 0, 38, v => `<b>+${v}%</b> CSAT`], ['m', 'res', 960, 420, 19.85, 90, 4, v => `<b>${v} min</b> avg. resolution`], ['icon', 'bolt', 1250, 420, 19.95],
  ['m', 'backlog', 790, 540, 20.05, 0, 45, v => `<b>−${v}%</b> backlog`], ['m', 'output', 1080, 540, 20.15, 1, 3, v => `<b>${v}×</b> agent output`],
  ['m', 'sla', 1150, 660, 20.3, 70, 98, v => `<b>${v}%</b> SLA met`], ['icon', 'doc', 1385, 660, 20.4],
];
const INDS = [['cart', 'Commerce'], ['cloud', 'SaaS'], ['bank', 'Fintech'], ['tower', 'Telecom'], ['plane', 'Travel'], ['heart', 'Health']];
const DOTS = [[620, 300], [1340, 260], [1300, 820], [640, 790]];

// ================= build =================
let capChunks = [];
function build() {
  $('hook').innerHTML = '';
  $('phoneScreen').innerHTML = ['mail', 'chat', 'wa', 'phone', 'hash', 'star'].map(k => `<i>${I[k]('#FF8A2A')}</i>`).join('');
  $('beams').innerHTML = [0, 1, 2, 3].map(i => `<div class="beam abs" id="bm${i}"></div>`).join('');
  $('orbs').innerHTML = ORBS.map((k, i) => `<div class="orb abs" id="ob${i}">${I[k]('#EDEDED')}</div>`).join('');
  $('chips').innerHTML = KEYS.map((k, i) => `<div class="chip abs" id="kc${i}">${k[0]}</div>`).join('') +
    METRICS.map((m, i) => m[0] === 'icon' ? `<div class="chip icon abs" id="mc${i}">${I[m[1]]('#EDEDED')}</div>` : `<div class="chip abs" id="mc${i}"></div>`).join('');
  $('dots').innerHTML = DOTS.map((_, i) => `<div class="dotp abs" id="dt${i}"></div>`).join('');
  $('ringDots').innerHTML = [0, 1, 2, 3].map(i => `<circle id="rd${i}" r="6" fill="#fff" style="filter:drop-shadow(0 0 6px #fff)"/>`).join('');
  $('inds').innerHTML = INDS.map((d, i) => `<div class="ind abs" id="in${i}">${I[d[0]]('rgba(237,237,237,.55)')}${d[1]}</div>`).join('');
  $('comets').innerHTML = [0, 1, 2, 3].map(i => `<div class="comet abs" id="cm${i}"></div>`).join('');
  $('letters').innerHTML = [...'Solve.'].map((c, i) => `<span class="lt abs" id="lt${i}">${c}</span>`).join('');
  // grain tile
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d'); const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd(i, 9) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); $('grain').style.backgroundImage = `url(${cv.toDataURL()})`;
  for (const id of ['sphere', 'shaft', 'hook', 'phone', 'logoMain', 'logoSub', 'reticle', 'sq', 'ringWord', 'trust', 'bigBlur', 'bigRing', 'ring2', 'beat',
    'glR', 'glG', 'glB', 'glW', 'wm', 'wmTag', 'cursor', 'cap']) MANAGED.push($(id));
  document.querySelectorAll('.beam,.orb,.chip,.dotp,.ind,.comet,.lt').forEach(el => MANAGED.push(el));
  for (const line of window.CAPTIONS || []) {
    let cur = [];
    line.words.forEach((w, i) => {
      cur.push(w);
      const last = i === line.words.length - 1;
      if (last || (/[.,!?]$/.test(w[0]) && cur.length >= 3) || cur.length >= 7) { capChunks.push({ words: cur, a: cur[0][1], b: last ? line.end : null }); cur = []; }
    });
  }
  capChunks.forEach((c, i) => { if (c.b === null) c.b = capChunks[i + 1].a; });
}

// ================= scenes =================
function wordsIn(el, words, t, key) {
  if (el.dataset.k !== key) { el.dataset.k = key; el.innerHTML = words.map(w => `<span${w[2] ? ' style="color:var(--or)"' : ''}>${w[0]}</span>`).join(''); }
  [...el.children].forEach((sp, i) => {
    const k = prog(t, words[i][1] - 0.05, words[i][1] + 0.3);
    sp.style.opacity = E.outCubic(k); sp.style.filter = `blur(${lerp(10, 0, E.outCubic(k))}px)`;
    sp.style.transform = `translateY(${lerp(16, 0, E.outExpo(k))}px)`;
  });
}

function scHook(t) {                                    // 0 – 7.5
  if (t < 3.9) {
    const o = 1 - E.inCubic(prog(t, 3.5, 3.9));
    wordsIn($('hook'), HOOK1, t, 'h1');
    S('hook', { x: 900, y: 540, o, blur: o < 1 ? (1 - o) * 12 : 0 });
    // tumbling phone drifts in from the right
    const k = E.outCubic(prog(t, 0.2, 3.9));
    S('phone', { x: lerp(1650, 1500, k), y: 520 + Math.sin(t * 1.3) * 12, s: 0.75, o: clamp(prog(t, 0.2, 0.8)) * o * 0.85, blur: 3 + (1 - o) * 10,
      tf: `perspective(900px) rotateY(${lerp(-70, 20, k)}deg) rotateZ(${lerp(-25, 12, k)}deg)` });
  } else {
    const a = io(t, 4.0, 4.4, 6.9, 7.35, { ein: E.outExpo });
    wordsIn($('hook'), HOOK2, t, 'h2');
    S('hook', { x: 1060, y: 540, o: a.o, blur: a.out * 14 });
    const k = E.outExpo(prog(t, 4.0, 4.9));
    S('phone', { x: lerp(500, 560, k), y: 540 + Math.sin(t * 1.5) * 8, s: lerp(0.5, 0.62, k) * lerp(1, 0.8, a.out), o: a.o, blur: a.blur * 0.6,
      tf: `perspective(900px) rotateY(${lerp(40, -18, k)}deg) rotateZ(${lerp(14, -8, k)}deg)` });
  }
}

function scLogo(t) {                                    // 7.3 – 11
  // beams sweep and converge
  const BM = [[-30, -500, 900, 7.35], [32, 400, -800, 7.45], [-62, -300, 600, 7.6], [58, 200, -500, 7.7]];
  BM.forEach(([ang, x0, x1, a], i) => {
    const k = E.inOutCubic(prog(t, a, a + 1.0)), out = prog(t, 8.45, 8.75);
    S('bm' + i, { x: 960 + lerp(x0, 0, k), y: 540 + lerp(x1 * 0.4, 0, k), o: clamp(prog(t, a, a + 0.2)) * (1 - out) * 0.9, tf: `rotate(${ang}deg) scaleX(${lerp(1, 0.4, k)})`, blur: 0 });
  });
  const lk = E.outExpo(prog(t, 8.45, 9.3));
  const out = io(t, 0, 0.01, 10.55, 11.0).out;
  if (t > 8.4) {
    S('logoMain', { y: 500 - E.inOutCubic(prog(t, 10.55, 11.2)) * 160, s: lerp(1.6, 1, lk) * lerp(1, 0.42, E.inOutCubic(prog(t, 10.55, 11.2))), o: clamp(prog(t, 8.4, 8.6)), blur: lerp(14, 0, lk) });
    setAp($('logoMain'), { r: +lerp(4, 37, lk).toFixed(1), rot: +lerp(-80, 0, lk).toFixed(1), grow: +prog(t, 8.42, 8.9).toFixed(3), bp: +(E.outCubic(prog(t, 8.6, 9.6)) * (1 - prog(t, 10.4, 10.7))).toFixed(3) });
    $('logoMain').style.filter += ` drop-shadow(0 0 ${lerp(60, 18, lk)}px rgba(255,110,5,.55))`;
    const sb = io(t, 10.15, 10.55, 10.5, 10.85, { ein: E.outExpo, blurIn: 10 });
    S('logoSub', { y: 720 + lerp(16, 0, sb.k), o: sb.o, blur: sb.blur });
  }
  void out;
}

function sphereAt(t, cy, s = 1, o = 1) { S('sphere', { y: cy, s, o, blur: 0 }); }

function scSphere(t) {                                  // 10.5 – 24.6
  // sphere rises, then the camera pushes inside it
  const rise = E.outQuint(prog(t, 10.5, 12.0));
  const push = E.inOutCubic(prog(t, 13.6, 14.5));
  const out = E.inCubic(prog(t, 24.3, 24.75));
  sphereAt(t, lerp(2100, 1450, rise) - push * 260, lerp(1, 1.25, push) * lerp(1, 1.3, out), clamp(prog(t, 10.5, 11)) * (1 - out));
  S('shaft', { y: 260 - push * 40, o: (0.25 + 0.75 * push) * (1 - out) * clamp(prog(t, 11.2, 12)), s: 1, blur: 0, tf: `scaleY(${lerp(0.6, 1, push)})` });
  // logo with orbiting channels (11 – 13.5), then it collapses into a focus reticle
  if (t < 14.4) {
    const lk = prog(t, 10.55, 11.2);
    const col = E.inExpo(prog(t, 13.2, 13.6));
    if (t >= 11.2) {
      S('logoMain', { y: 340, s: 0.42 * (1 - col), o: 1 - col, blur: col * 8 });
      setAp($('logoMain'), { r: 37, rot: 0, grow: 1, bp: 0 });
      $('logoMain').style.filter = `drop-shadow(0 0 18px rgba(255,110,5,.55))`;
    }
    ORBS.forEach((k, i) => {
      const a0 = i / ORBS.length * Math.PI * 2 + t * 0.9;
      const ink = E.outBack(prog(t, 11.2 + i * 0.07, 11.7 + i * 0.07));
      const suck = E.inExpo(prog(t, 12.7 + i * 0.03, 13.3 + i * 0.03));
      const rx = lerp(360, 0, suck), ry = lerp(150, 0, suck);
      const z = Math.sin(a0);
      S('ob' + i, { x: 960 + Math.cos(a0) * rx, y: 340 + z * ry, s: ink * lerp(0.75, 1.05, (z + 1) / 2) * (1 - suck * 0.7), o: clamp(ink) * (1 - prog(t, 13.15, 13.35)), blur: lerp(2.5, 0, (z + 1) / 2) + suck * 6 });
      $('ob' + i).style.zIndex = z > 0 ? 3 : 1;
    });
    const rk = E.outBack(prog(t, 13.4, 13.8)), ro = 1 - prog(t, 14.0, 14.3);
    if (t > 13.35) S('reticle', { y: 340 + push * 40, s: rk * (1 + 0.08 * Math.sin(t * 9)), o: clamp(rk) * ro, tf: `rotate(${lerp(-90, 0, clamp(rk))}deg)`, blur: (1 - ro) * 8 });
  }
  // keyword chips (14.4 – 19.4)
  if (t >= 14.3 && t < 19.6) {
    const go = E.inCubic(prog(t, 19.05, 19.5));
    KEYS.forEach(([txt, x, y, a, hot], i) => {
      const k = E.outExpo(prog(t, a, a + 0.5));
      const depth = rnd(i, 4);             // pseudo depth-of-field
      const isHot = hot && t >= hot;
      const el = $('kc' + i);
      el.style.color = isHot ? '#fff' : 'rgba(237,237,237,.78)';
      el.style.background = isHot ? 'rgba(255,110,5,.16)' : 'rgba(255,255,255,.035)';
      el.style.boxShadow = isHot ? 'inset 0 0 0 1.5px rgba(255,110,5,.85), 0 0 30px rgba(255,110,5,.25)' : 'inset 0 0 0 1px rgba(255,255,255,.10)';
      const pulse = hot ? 1 + 0.08 * Math.sin(Math.PI * prog(t, hot, hot + 0.3)) : 1;
      S(el, { x: x + (t - a) * (depth - 0.5) * 6, y: y + 40 + lerp(30, 0, k) - go * 40, o: clamp(k * 1.5) * (1 - go) * (isHot ? 1 : lerp(0.55, 0.9, depth)), blur: lerp(14, depth < 0.25 && !isHot ? 2.5 : 0, k) + go * 12, s: pulse * lerp(0.92, 1, k) });
    });
  }
  // metric chips (19.4 – 24.6) with counters and a cursor click
  if (t >= 19.4 && t < 24.7) {
    const go = E.inCubic(prog(t, 24.15, 24.6));
    METRICS.forEach((m, i) => {
      const [kind, key, x, y, a] = m;
      const k = E.outExpo(prog(t, a, a + 0.5));
      const el = $('mc' + i);
      if (kind === 'm') {
        const v = Math.round(lerp(m[5], m[6], E.outCubic(prog(t, a + 0.1, a + 1.8))));
        el.innerHTML = m[7](v);
      }
      const isPick = key === 'csat' && t >= 22.05;
      el.style.background = isPick ? 'rgba(255,110,5,.9)' : 'rgba(255,255,255,.035)';
      el.style.color = isPick ? '#fff' : '';
      el.style.boxShadow = isPick ? '0 0 40px rgba(255,110,5,.45)' : 'inset 0 0 0 1px rgba(255,255,255,.10)';
      const press = key === 'csat' ? Math.sin(Math.PI * prog(t, 22.0, 22.16)) : 0;
      const depth = rnd(i, 6);
      S(el, { x: x + (t - a) * (depth - 0.5) * 5, y: y + 40 + lerp(30, 0, k), o: clamp(k * 1.5) * (1 - go) * lerp(0.7, 1, depth), blur: lerp(14, 0, k) + go * 16, s: lerp(0.92, 1, k) * (1 - press * 0.06) });
    });
    if (t > 21.2 && t < 23.4) {
      const ck = E.inOutCubic(prog(t, 21.25, 21.98)), press = Math.sin(Math.PI * prog(t, 22.0, 22.16));
      S('cursor', { x: lerp(1000, 690, ck) + 12, y: lerp(800, 470, ck) + 16, o: clamp((t - 21.2) * 6) * (1 - prog(t, 23.0, 23.35)), s: 1 - press * 0.18 });
    }
  }
}

function scRing(t) {                                    // 24.4 – 28.2
  // chips burst to four bright dots, dots link into a square, square bends into a ring
  const dk = E.outExpo(prog(t, 24.45, 25.1));
  const lineK = prog(t, 25.25, 25.95);
  const toRing = E.inOutExpo(prog(t, 26.05, 26.55));
  const out = io(t, 0, .01, 27.8, 28.2).out;
  DOTS.forEach(([x, y], i) => {
    const sx = 960 + (rnd(i, 7) - 0.5) * 200, sy = 540 + (rnd(i, 8) - 0.5) * 120;
    const ang = (-135 + 90 * i) * Math.PI / 180;
    const rx = 960 + Math.cos(ang) * 168 * 1.414 * 0.71, ry = 540 + Math.sin(ang) * 168 * 1.414 * 0.71;
    const px = lerp(lerp(sx, x, dk), rx, toRing), py = lerp(lerp(sy, y, dk), ry, toRing) + Math.sin(t * 2 + i) * 6 * (1 - toRing);
    S('dt' + i, { x: px, y: py, o: clamp(prog(t, 24.45, 24.7)) * (1 - prog(t, 26.45, 26.6)), s: 1, blur: lerp(6, 0, dk) });
    DOTS[i].cur = [px, py];
  });
  if (t > 25.2 && t < 26.6) {
    const pts = [0, 1, 2, 3, 0].map(i => DOTS[i].cur);
    const n = lineK * 4; let d = '';
    for (let s = 0; s < 4; s++) {
      const kk = clamp(n - s); if (kk <= 0) break;
      const [a, b] = [pts[s], pts[s + 1]];
      if (!d) d = `${a[0]},${a[1]} `;
      d += `${lerp(a[0], b[0], kk)},${lerp(a[1], b[1], kk)} `;
    }
    $('sqLine').setAttribute('points', d);
    S('sq', { o: 1 - prog(t, 26.3, 26.55), blur: 0 });
  }
  if (t > 26.2) {
    const rk = E.outExpo(prog(t, 26.2, 26.9));
    S('ringWord', { s: lerp(0.8, 1, rk) * lerp(1, 1.1, out), o: clamp(prog(t, 26.2, 26.4)) * (1 - out), blur: out * 14 });
    const L = 2 * Math.PI * 168, arc = $('ringArc');
    arc.style.strokeDasharray = `${L * lerp(0.15, 0.35, rk)} ${L}`; arc.style.strokeDashoffset = -t * 260;
    [0, 1, 2, 3].forEach(i => { const a = (t * 70 + i * 90) * Math.PI / 180; const c = $('rd' + i); c.setAttribute('cx', Math.cos(a) * 168); c.setAttribute('cy', Math.sin(a) * 168); });
    const tk = prog(t, 26.45, 26.85);
    $('ringTxt').style.opacity = E.outCubic(tk); $('ringTxt').style.filter = `blur(${lerp(10, 0, tk)}px)`;
  }
}

function scTrust(t) {                                   // 28.1 – 32.6
  const a = io(t, 28.25, 28.8, 31.9, 32.4, { ein: E.outExpo });
  S('trust', { y: 400 + lerp(24, 0, a.k), o: a.o, blur: a.blur, s: lerp(1, 0.97, a.out) });
  $('trust').querySelector('em').style.opacity = clamp(prog(t, 30.2, 30.5));
  INDS.forEach((d, i) => {
    const k = E.outExpo(prog(t, 29.0 + i * 0.14, 29.5 + i * 0.14));
    const flick = rnd(Math.floor(t * 12) + i * 40, 3) < 0.08 ? 0.4 : 1;
    const x = 960 + (i - 2.5) * 270, y = 650 + (i % 2) * 0;
    S('in' + i, { x, y: y + lerp(20, 0, k), o: clamp(k * 1.5) * (1 - a.out) * flick, blur: lerp(12, 0, k) + a.out * 12 });
  });
}

function scBeats(t) {                                   // 32.2 – 39.5
  // big blurred word slides past
  if (t < 33.1) { const k = prog(t, 32.2, 33.1); S('bigBlur', { x: lerp(1500, 420, k), y: 560, o: Math.sin(Math.PI * k) * 0.9, blur: 28, s: 1 }); }
  // "See."
  const word = (txt, a, b, extra = {}) => {
    const w = io(t, a, a + 0.28, b - 0.22, b, { ein: E.outExpo, blurIn: 22, blurOut: 16 });
    $('beat').textContent = txt;
    S('beat', { s: lerp(1.35, 1, w.k) * lerp(1, 1.06, w.out) * (extra.s || 1), o: w.o, blur: w.blur, y: 540 });
  };
  if (t >= 32.85 && t < 34.5) word('See.', 32.95, 34.45);
  if (t >= 34.45 && t < 35.75) word('Decide.', 34.55, 35.7);
  // comets streak past "Decide."
  [0, 1, 2, 3].forEach(i => {
    const a = 34.5 + i * 0.22, k = prog(t, a, a + 0.5);
    if (k > 0 && k < 1) { const ang = 200 + i * 40; S('cm' + i, { x: 960 + Math.cos(ang * Math.PI / 180) * lerp(700, 120, k), y: 540 + Math.sin(ang * Math.PI / 180) * lerp(420, 80, k), o: Math.sin(Math.PI * k), tf: `rotate(${ang + 180}deg)`, blur: 0 }); }
  });
  // "Solve." — letters drift in from scattered positions and lock together
  if (t >= 35.6 && t < 39.5) {
    const lockK = E.inOutExpo(prog(t, 35.75, 36.3));
    const big = E.outExpo(prog(t, 36.9, 37.5));
    const out = io(t, 0, .01, 38.95, 39.45).out;
    const chars = [...'Solve.'];
    const widths = [64, 66, 30, 64, 66, 28]; const tot = widths.reduce((a, b) => a + b, 0) * lerp(1, 1.18, big);
    let x0 = 960 - tot / 2;
    chars.forEach((c, i) => {
      const w = widths[i] * lerp(1, 1.18, big);
      const fx = x0 + w / 2; x0 += w;
      const sx = 960 + (rnd(i, 11) - 0.5) * 900, sy = 540 + (rnd(i, 12) - 0.5) * 520;
      const el = $('lt' + i);
      el.style.fontWeight = big > 0.5 ? 600 : 500;
      S(el, { x: lerp(sx, fx, lockK), y: lerp(sy, 540, lockK), s: lerp(0.45, 1, lockK) * lerp(1, 1.18, big) * lerp(1, 1.08, out), o: clamp(prog(t, 35.6, 35.9)) * (1 - out) * (0.5 + 0.5 * lockK), blur: lerp(8, 0, lockK) + out * 16,
        tf: `rotate(${lerp((rnd(i, 13) - 0.5) * 60, 0, lockK)}deg)` });
      el.style.color = big > 0.3 ? '#fff' : '#EDEDED';
      el.style.textShadow = `0 0 ${40 * big}px rgba(255,140,60,${0.6 * big})`;
    });
    // giant ring flies in from the camera on the hit
    const rk = E.outQuint(prog(t, 36.85, 37.6));
    if (t > 36.8) S('bigRing', { s: lerp(4, 1, rk) * lerp(1, 1.15, out), o: clamp(prog(t, 36.8, 37.0)) * (1 - out) * lerp(1, 0.85, rk), blur: lerp(20, 0, rk) + out * 20, tf: `rotate(${t * 20}deg)` });
    $('bigRing').style.borderColor = `rgba(255,${Math.round(lerp(255, 160, big))},${Math.round(lerp(255, 80, big))},1)`;
    if (t > 37.0) S('ring2', { s: lerp(0.6, 1, E.outExpo(prog(t, 37.0, 37.6))), o: (1 - out) * 0.8, blur: out * 10 });
  }
}

function scGlitch(t) {                                  // 39.4 – 41.8
  const conv = E.inOutExpo(prog(t, 39.55, 40.75));
  const jit = (1 - conv) * (rnd(Math.floor(t * 30), 21) - 0.5);
  const slice = (seed) => { // horizontal slice displacement via clip-path
    if (conv > 0.95) return 'none';
    const y = rnd(Math.floor(t * 24), seed) * 80 + 10, h = 6 + rnd(Math.floor(t * 24), seed + 1) * 18;
    return `polygon(0 0,100% 0,100% ${y}%,0 ${y}%)`.replace(/polygon\(.*\)/, `polygon(0 0,100% 0,100% ${y}%,0 ${y}%,0 ${y + h}%,100% ${y + h}%,100% 100%,0 100%)`);
  };
  const base = { r: 37, rot: 0, grow: 1, bp: 0, lines: false };
  const vis = clamp(prog(t, 39.4, 39.6)) * (1 - prog(t, 41.5, 41.75));
  const sc = lerp(1.25, 1, conv) * (1 + 0.03 * Math.sin(Math.PI * prog(t, 40.75, 41.0)));
  [['glR', '#ff2a2a', -1], ['glG', '#22ff66', 0.3], ['glB', '#3b6bff', 1]].forEach(([id, c, dir]) => {
    setAp($(id), { ...base, color: c, gap: '#000' });
    S(id, { x: 960 + dir * lerp(60, 0, conv) + jit * 40 * dir, y: 520 + jit * 10, s: sc, o: vis * (1 - prog(t, 40.6, 40.9)), blur: lerp(4, 0, conv) });
    $(id).style.clipPath = slice(dir * 10 + 30);
  });
  const wk = prog(t, 40.6, 40.9);
  const orange = prog(t, 40.95, 41.35);
  setAp($('glW'), { ...base, color: orange > 0.5 ? '#FF6E05' : '#ffffff', gap: '#000' });
  S('glW', { y: 520, s: sc, o: vis * wk, blur: 0 });
  $('glW').style.filter = `drop-shadow(0 0 ${lerp(50, 16, orange)}px rgba(255,${orange > 0.5 ? 110 : 255},${orange > 0.5 ? 5 : 255},.6))`;
  $('glW').style.mixBlendMode = 'normal';
}

function scWordmark(t) {                                // 41.5 – 45
  const k = E.outExpo(prog(t, 41.55, 42.4));
  const fin = E.inCubic(prog(t, 44.3, 44.95));
  S('wm', { y: 520, o: clamp(prog(t, 41.5, 41.75)) * (1 - fin), s: lerp(1.04, 1, k) * lerp(1, 0.98, fin), blur: lerp(8, 0, k) + fin * 8 });
  setAp($('wmLogo'), { r: 37, rot: 0, grow: 1, bp: 0, lines: true });
  $('wmLogo').style.filter = 'drop-shadow(0 0 16px rgba(255,110,5,.45))';
  const tx = $('wmTxt');
  tx.style.letterSpacing = lerp(70, 26, k) + 'px';
  tx.style.opacity = E.outCubic(prog(t, 41.7, 42.2));
  tx.style.clipPath = `inset(0 ${(1 - E.outExpo(prog(t, 41.7, 42.5))) * 100}% 0 0)`;
  const tg = io(t, 42.45, 42.95, 44.3, 44.95, { ein: E.outExpo, blurIn: 8 });
  S('wmTag', { x: 960 + 60, y: 640 + lerp(14, 0, tg.k), o: tg.o, blur: tg.blur });
}

function captions(t) {
  const c = capChunks.find(c => t >= c.a - 0.08 && t < c.b);
  if (!c) return;
  const box = $('cap');
  if (box.dataset.k != c.a) { box.dataset.k = c.a; box.innerHTML = c.words.map(w => `<span>${w[0]}</span>`).join(''); }
  const k = E.outExpo(prog(t, c.a - 0.08, c.a + 0.2)), o = 1 - prog(t, c.b - 0.15, c.b);
  S(box, { x: 960, y: 985, o: clamp(k * 1.5) * o, blur: lerp(6, 0, k) });
  [...box.children].forEach((sp, i) => {
    const [, a, b] = c.words[i];
    const on = t >= a && t < b + 0.06, past = t >= b;
    sp.style.color = on ? '#FF8A2A' : past ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.32)';
  });
}

function render(t) {
  hideAll();
  if (t < 7.5) scHook(t);
  if (t >= 7.3 && t < 11.3) scLogo(t);
  if (t >= 10.5 && t < 24.8) scSphere(t);
  if (t >= 24.4 && t < 28.3) scRing(t);
  if (t >= 28.1 && t < 32.6) scTrust(t);
  if (t >= 32.2 && t < 39.5) scBeats(t);
  if (t >= 39.4 && t < 41.8) scGlitch(t);
  if (t >= 41.5) scWordmark(t);
  captions(t);
  // grain shifts every frame, slow global camera breathing
  const f = Math.floor(t * 60);
  $('grain').style.backgroundPosition = `${Math.floor(rnd(f, 2) * 256)}px ${Math.floor(rnd(f, 3) * 256)}px`;
  $('stage').style.filter = t < 0.5 ? `brightness(${prog(t, 0, 0.5)})` : 'none';
}

window.DURATION = 45.0;
window.seek = t => render(t);
window.ready = document.fonts.ready.then(() => { build(); render(0); return true; });
if (!navigator.webdriver) {
  window.ready.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); }; loop(); });
}
</script>
</body>
