<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rasolv Two Clocks</title>
<style>
  @font-face { font-family: 'Rubik'; src: url('../fonts/Rubik.woff2') format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'Rubik'; src: url('../fonts/Rubik-Arabic.woff2') format('woff2'); font-weight: 300 900;
    unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }

  :root { --or: #FF6E05; --or2: #FF9A3D; --ink: #070707; --tx: #EDEDED; --grey: #8E9196; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: 'Rubik', sans-serif; -webkit-font-smoothing: antialiased; color: var(--tx); }

  #grain { opacity: .06; mix-blend-mode: screen; z-index: 60; }
  #vig { background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.7) 100%); z-index: 59; }

  /* the two halves: each is a clip window; its 540px-wide world sits centred inside it */
  .half { position: absolute; top: 0; height: 1920px; overflow: hidden; }
  .world { position: absolute; top: 0; width: 540px; height: 1920px; transform-origin: 50% 22%; }
  #L { background: linear-gradient(180deg, #121417 0%, #0b0c0e 60%, #08090a 100%); }
  #R { background: radial-gradient(ellipse 120% 60% at 50% 62%, #1d1209 0%, #0c0805 55%, #070707 100%); }
  #split { width: 3px; height: 1920px; top: 0; background: linear-gradient(180deg, transparent, rgba(255,140,60,.9) 20%, #fff 50%, rgba(255,140,60,.9) 80%, transparent);
    box-shadow: 0 0 18px rgba(255,110,5,.8), 0 0 60px rgba(255,110,5,.35); z-index: 20; }

  /* timers */
  .clk { left: 50%; top: 250px; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
  .clk .lab { font-size: 22px; font-weight: 500; letter-spacing: 6px; margin-bottom: 6px; }
  .clk .dig { font-size: 132px; font-weight: 500; letter-spacing: -2px; line-height: 1; display: flex; justify-content: center; }
  .clk .dig span { display: inline-block; width: .6em; text-align: center; }
  .clk .dig span.c { width: .3em; }
  #clkL { color: var(--grey); } #clkL .lab { color: rgba(142,145,150,.7); }
  #clkR { color: var(--or); } #clkR .lab { color: rgba(255,154,61,.85); }
  #clkR .dig { text-shadow: 0 0 30px rgba(255,110,5,.55); }

  /* left: the window behind the waiting person */
  #win { left: 70px; top: 470px; width: 400px; height: 520px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 10px #15171a, 0 0 0 2px #1e2024; }
  #winSky { position: absolute; inset: 0; }
  #win::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent calc(50% - 5px), #15171a calc(50% - 5px), #15171a calc(50% + 5px), transparent calc(50% + 5px)),
    linear-gradient(180deg, transparent calc(45% - 5px), #15171a calc(45% - 5px), #15171a calc(45% + 5px), transparent calc(45% + 5px)); }
  #skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; }

  /* people (silhouettes lit by their phones) */
  #glowR { left: 0; top: 520px; width: 540px; height: 700px; background: radial-gradient(ellipse 50% 50% at 50% 45%, rgba(255,120,30,.32), rgba(255,110,5,.08) 55%, transparent 75%); }
  .who { width: 420px; height: 470px; left: 60px; top: 640px; }
  .who svg { width: 100%; height: 100%; overflow: visible; }

  /* phones */
  .phone { width: 360px; height: 640px; left: 90px; top: 1000px; border-radius: 48px; background: #0a0a0a;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), inset 0 0 0 9px #151515, 0 40px 80px rgba(0,0,0,.7); overflow: hidden; transform-origin: 50% 50%; }
  .scr { position: absolute; inset: 9px; border-radius: 40px; overflow: hidden; }
  #scrL { background: linear-gradient(180deg, #1b1d21, #101114); }
  #scrR { background: linear-gradient(180deg, #141414, #0b0b0b); }
  .notch { position: absolute; left: 50%; top: 14px; width: 92px; height: 24px; margin-left: -46px; border-radius: 12px; background: #000; z-index: 5; }

  /* call screen */
  #callTop { position: absolute; top: 70px; left: 0; right: 0; text-align: center; }
  #callTop b { display: block; font-size: 25px; font-weight: 500; color: #d7d9dc; }
  #callTop i { display: block; font-style: normal; font-size: 19px; color: #7d8086; margin-top: 6px; }
  #callTime { position: absolute; top: 160px; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 400; color: #b9bcc1; letter-spacing: 1px; }
  #wave { position: absolute; top: 255px; left: 50%; width: 220px; height: 70px; margin-left: -110px; display: flex; align-items: center; justify-content: space-between; }
  #wave i { width: 8px; border-radius: 4px; background: #5d6066; }
  #holdMsg { position: absolute; top: 345px; left: 20px; right: 20px; text-align: center; font-size: 17px; color: #6c6f75; line-height: 1.4; }
  #callBtns { position: absolute; bottom: 52px; left: 0; right: 0; display: grid; grid-template-columns: repeat(3, 76px); gap: 18px 26px; justify-content: center; }
  #callBtns i { width: 76px; height: 76px; border-radius: 50%; background: #26282c; display: flex; align-items: center; justify-content: center; }
  #callBtns i.on { background: #d9dbde; }

  /* chat screen */
  #chatHead { position: absolute; top: 52px; left: 22px; right: 22px; height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.08); }

  .row { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .row .t { font-size: 15px; font-weight: 500; color: rgba(255,154,61,.95); width: 46px; flex: none; font-variant-numeric: tabular-nums; }

  #compTxt { position: absolute; left: 20px; right: 70px; top: 50%; transform: translateY(-50%); font-size: 17px; color: #eee; white-space: nowrap; overflow: hidden; }

  /* Maya at her desk */
  #desk { left: 40px; top: 560px; width: 460px; height: 360px; border-radius: 28px; overflow: hidden; background: radial-gradient(ellipse 70% 80% at 30% 20%, #3a2410 0%, #1a1009 45%, #0c0805 100%);

  #deskTag { position: absolute; left: 22px; bottom: 18px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 500; color: #fff; padding: 8px 14px 8px 8px; border-radius: 22px; background: rgba(0,0,0,.55); }
  #deskTag em { font-style: normal; color: rgba(255,154,61,.95); font-weight: 400; }
  #deskLive { position: absolute; right: 20px; top: 18px; font-size: 14px; font-weight: 600; letter-spacing: 2px; color: #fff; display: flex; align-items: center; gap: 8px; }
  #deskLive i { width: 10px; height: 10px; border-radius: 50%; background: #FF3B30; box-shadow: 0 0 10px #FF3B30; }

  /* supers + disclaimer */
  #sup { left: 540px; top: 1740px; transform: translate(-50%, -50%); z-index: 30; white-space: nowrap; font-size: 62px; font-weight: 600; letter-spacing: -1px; color: #fff;
    text-shadow: 0 4px 30px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8); display: flex; gap: 16px; }
  #sup span { display: inline-block; }
  #supBand { left: 0; right: 0; top: 1560px; height: 360px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.82) 45%); z-index: 29; }
  #disc { left: 540px; top: 1850px; transform: translateX(-50%); z-index: 31; font-size: 22px; font-weight: 400; color: rgba(237,237,237,.62); letter-spacing: .5px; white-space: nowrap; }

  /* black card */
  #black { z-index: 40; background: #000; }
  #stopTxt { left: 540px; top: 900px; transform: translate(-50%, -50%); z-index: 41; text-align: center; font-size: 84px; font-weight: 600; letter-spacing: -2px; line-height: 1.18; color: #fff; white-space: nowrap; }
  #stopTxt em { font-style: normal; color: var(--or); text-shadow: 0 0 40px rgba(255,110,5,.45); }
  #caret { display: inline-block; width: 6px; height: 80px; margin-left: 6px; vertical-align: -10px; background: #fff; }

  /* end card */
  #end { z-index: 42; background: radial-gradient(ellipse 70% 45% at 50% 40%, #1a0d03 0%, #070707 70%); }
  #endLine { width: 3px; left: 540px; z-index: 43; background: linear-gradient(180deg, transparent, var(--or) 25%, #fff 50%, var(--or) 75%, transparent); box-shadow: 0 0 20px rgba(255,110,5,.9); transform: translateX(-50%); }
  #logo { width: 250px; height: 250px; left: 540px; top: 640px; z-index: 44; }
  #wm { left: 540px; top: 845px; z-index: 44; font-size: 92px; font-weight: 500; letter-spacing: 6px; color: #fff; white-space: nowrap; }
  #title { left: 540px; top: 1030px; z-index: 44; font-size: 68px; font-weight: 600; letter-spacing: -1.5px; white-space: nowrap; color: #fff; }
  #title em { font-style: normal; color: var(--or); }
  #when { left: 540px; top: 1125px; z-index: 44; font-size: 36px; font-weight: 400; white-space: nowrap; color: rgba(237,237,237,.85); letter-spacing: .5px; }
  #remind { left: 540px; top: 1260px; z-index: 44; height: 96px; padding: 0 46px; border-radius: 48px; background: var(--or); color: #fff; display: flex; align-items: center; gap: 16px;
    font-size: 36px; font-weight: 600; white-space: nowrap; box-shadow: 0 16px 50px rgba(255,110,5,.4); }
  #remind svg { width: 38px; height: 38px; }
  #ring { left: 540px; top: 1260px; z-index: 43; height: 96px; border-radius: 48px; border: 3px solid var(--or); }
  #getApp { left: 540px; top: 1385px; z-index: 44; font-size: 28px; font-weight: 400; color: rgba(237,237,237,.7); white-space: nowrap; }
  #getApp b { color: #fff; font-weight: 600; letter-spacing: 1px; }
  #tag { left: 540px; top: 1720px; z-index: 44; display: flex; gap: 22px; align-items: center; white-space: nowrap; }
  #tag .en { font-size: 24px; letter-spacing: 8px; color: rgba(237,237,237,.62); }
  #tag .ar { font-size: 32px; color: var(--or2); }
  #tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--or); }
</style>
</head>
<body>
<div id="stage">
  <div id="L" class="half"><div class="world" id="wL">
    <div id="win" class="abs"><div id="winSky"></div><svg id="skyline" viewBox="0 0 400 170" preserveAspectRatio="none"></svg></div>
    <div id="whoL" class="who abs"></div>
    <div id="phL" class="phone abs"><div class="notch"></div><div class="scr" id="scrL">
      <div id="callTop"><b>Customer Support</b><i>On hold · speaker</i></div>
      <div id="callTime">00:00</div>
      <div id="wave"></div>
      <div id="holdMsg">Your call is important to us.<br>Please stay on the line.</div>
      <div id="callBtns"></div>
    </div></div>
    <div id="clkL" class="clk abs"><div class="lab">ON HOLD</div><div class="dig"></div></div>
  </div></div>

  <div id="R" class="half"><div class="world" id="wR">
    <div id="glowR" class="abs"></div>
    <div id="whoR" class="who abs"></div>
    <div id="desk" class="abs"><svg viewBox="0 0 460 360" id="deskArt"></svg><div id="deskLive"><i></i>LIVE</div><div id="deskTag"><span class="av">M</span>Maya <em>· Billing</em></div></div>
    <div id="phR" class="phone abs"><div class="notch"></div><div class="scr" id="scrR">
      <div id="chatHead"><svg id="chatLogo" viewBox="-110 -110 220 220"></svg><b>RASOLV</b><em id="chatState">online</em></div>
      <div id="msgs"><div id="bub"></div><div id="scan"></div><div id="rows"></div></div>
      <div id="comp"><div id="compTxt"></div><div id="sendBtn"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="#fff"/></svg></div></div>
    </div></div>
    <svg id="thumb" class="abs" viewBox="0 0 150 300"><defs><linearGradient id="thg" x1="0" x2="1"><stop offset="0" stop-color="#3a2210"/><stop offset=".55" stop-color="#7a4520"/><stop offset="1" stop-color="#c47432"/></linearGradient></defs>
      <path d="M38 300 C30 220 28 120 46 52 C56 16 104 14 112 52 C124 110 122 210 114 300 Z" fill="url(#thg)"/><path d="M58 40 C62 20 96 20 100 40 C102 62 96 82 79 84 C62 82 56 62 58 40Z" fill="#e7a06a" opacity=".55"/></svg>
    <div id="clkR" class="clk abs"><div class="lab">RASOLV</div><div class="dig"></div></div>
  </div></div>

  <div id="split" class="abs"></div>
  <div id="supBand" class="abs"></div>
  <div id="sup" class="abs"></div>
  <div id="disc" class="abs">Example story. Times vary.</div>

  <div id="black" class="layer"></div>
  <div id="stopTxt" class="abs"></div>

  <div id="end" class="layer"></div>
  <div id="endLine" class="abs"></div>
  <svg id="logo" class="abs" viewBox="-110 -110 220 220"></svg>
  <div id="wm" class="abs">RASOLV</div>
  <div id="title" class="abs">One picture. <em>Two languages.</em></div>
  <div id="when" class="abs"></div>
  <div id="ring" class="abs"></div>
  <div id="remind" class="abs"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z M10 21h4" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Set a reminder</div>
  <div id="getApp" class="abs">Get the <b>RASOLV</b> app.</div>
  <div id="tag" class="abs"><span class="en">VISION THAT SOLVES</span><i></i><span class="ar">رؤية تحُلّ</span></div>

  <div id="vig" class="layer"></div>
  <div id="grain" class="layer"></div>
</div>

<script>
// ================= settings =================
// Premiere slot. Swap "[TZ]" for the market's zone (e.g. "GST", "ET") or pass ?tz=GST — the end card reads it.
const PREMIERE = { day: 'Thu Oct 22', time: '8pm', tz: new URLSearchParams(location.search).get('tz') || '[TZ]' };

// ================= helpers =================
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: k => 1 - Math.pow(1 - k, 3), inCubic: k => k * k * k,
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outExpo: k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k),
  inOutExpo: k => k === 0 ? 0 : k === 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  inQuad: k => k * k,
};
// fade in a→b, out c→d (opacity, eased progress, blur)
function io(t, a, b, c = 1e9, d = 1e9, blur = 14) {
  const ki = E.outCubic(prog(t, a, b)), ko = E.inCubic(prog(t, c, d));
  return { k: ki, o: clamp(prog(t, a, b) * 1.4) * (1 - ko), blur: lerp(blur, 0, ki) + lerp(0, blur, ko) };
}
function show(el, { o = 1, x, y, s = 1, tf = '', blur = 0, center = true } = {}) {
  if (typeof el === 'string') el = $(el);
  const st = el.style;
  st.display = o > 0.001 ? '' : 'none';
  st.opacity = o;
  if (x !== undefined) st.left = x + 'px';
  if (y !== undefined) st.top = y + 'px';
  st.transform = `${center ? 'translate(-50%, -50%) ' : ''}${tf} scale(${s})`;
  st.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
}
const hide = el => { (typeof el === 'string' ? $(el) : el).style.display = 'none'; };
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
// piecewise-linear map through [t, value] keys (smoothstepped inside each segment)
function keys(t, K) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) {
    const [a, va] = K[i - 1], [b, vb, ease] = K[i];
    return lerp(va, vb, (ease || (k => k))(prog(t, a, b)));
  }
  return K[K.length - 1][1];
}
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// ================= RASOLV aperture mark =================
function aperture({ r = 37, rot = 0, bp = 1, grow = 1, color = '#FF6E05', gap = '#000', R = 80, lines = true } = {}) {
  const P = (a, rad) => [rad * Math.cos(a * Math.PI / 180), rad * Math.sin(a * Math.PI / 180)];
  const O = [...Array(6)].map((_, i) => P(-90 + 60 * i, R));
  const I = [...Array(6)].map((_, i) => P(-60 + 60 * i + rot, Math.max(r, 0.01)));
  const ang = q => (Math.atan2(q[1], q[0]) * 180 / Math.PI + 360) % 360;
  const hit = (p, d) => {
    let best = null;
    for (let k = 0; k < 6; k++) {
      const a = O[k], b = O[(k + 1) % 6], e = [b[0] - a[0], b[1] - a[1]];
      const den = d[0] * e[1] - d[1] * e[0]; if (Math.abs(den) < 1e-9) continue;
      const t = ((a[0] - p[0]) * e[1] - (a[1] - p[1]) * e[0]) / den;
      const u = ((a[0] - p[0]) * d[1] - (a[1] - p[1]) * d[0]) / den;
      if (t > 1e-6 && u >= -1e-6 && u <= 1 + 1e-6 && (!best || t < best.t)) best = { t, q: [p[0] + t * d[0], p[1] + t * d[1]] };
    }
    return best.q;
  };
  const Pt = I.map((q, i) => { const pr = I[(i + 5) % 6]; return hit(q, [q[0] - pr[0], q[1] - pr[1]]); });
  const f = q => q[0].toFixed(2) + ',' + q[1].toFixed(2);
  let blades = '', seps = '';
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6, a0 = ang(Pt[i]), span = (ang(Pt[j]) - a0 + 360) % 360;
    const mids = O.filter(v => { const d = (ang(v) - a0 + 360) % 360; return d > 1e-3 && d < span - 1e-3; })
                  .sort((u, v) => ((ang(v) - a0 + 360) % 360) - ((ang(u) - a0 + 360) % 360));
    const poly = [I[i], I[j], Pt[j], ...mids, Pt[i]];
    const c = poly.reduce((m, q) => [m[0] + q[0] / poly.length, m[1] + q[1] / poly.length], [0, 0]);
    const g = 0.6 + 0.4 * clamp(grow * 1.6 - i * 0.12);
    const o = clamp(grow * 2 - i * 0.18);
    blades += `<polygon points="${poly.map(f).join(' ')}" fill="${color}" opacity="${o}" transform="translate(${f(c)}) scale(${g}) translate(${f([-c[0], -c[1]])})"/>`;
    seps += `<line x1="${f(I[i]).replace(',', '" y1="')}" x2="${f(Pt[i]).replace(',', '" y2="')}" stroke="${gap}" stroke-width="4.2" stroke-linecap="square"/>`;
    if (lines && (i === 0 || i === 3)) {
      const s0 = [I[i][0] + (I[j][0] - I[i][0]) * 0.55, I[i][1] + (I[j][1] - I[i][1]) * 0.55];
      const d = [Pt[i][0] - I[i][0], Pt[i][1] - I[i][1]];

  // the split line slides in, then folds into the aperture
  const slide = E.outExpo(prog(t, T.endIn, T.endIn + 0.45));
  const fold = E.inOutCubic(prog(t, T.logo - 0.05, T.logo + 0.35));
  const h = lerp(1920, 8, fold);
  const ly = lerp(lerp(-960, 960, slide), 640, fold);
  $('endLine').style.height = h + 'px';
  show('endLine', { x: 540, y: ly, o: 1 - prog(t, T.logo + 0.25, T.logo + 0.4) });
  const ap = E.outCubic(prog(t, T.logo + 0.15, T.logo + 0.9));
  setAp($('logo'), { r: lerp(70, 37, ap), rot: lerp(-60, 0, ap), bp: 0, grow: ap, lines: true, gap: '#0c0703' });
  show('logo', { x: 540, y: 640, o: clamp(ap * 3), s: lerp(0.7, 1, E.outBack(ap)) });
  const wm = io(t, T.logo + 0.45, T.logo + 0.9);
  show('wm', { x: 540, y: 845, o: wm.o, blur: wm.blur, s: lerp(1.08, 1, wm.k) });
  $('wm').style.letterSpacing = lerp(30, 6, wm.k) + 'px';
  const ti = io(t, 26.15, 26.55);
  show('title', { x: 540, y: 1030, o: ti.o, blur: ti.blur, tf: `translateY(${lerp(20, 0, ti.k)}px)` });
  const wh = io(t, 27.6, 27.95);
  show('when', { x: 540, y: 1125, o: wh.o, blur: wh.blur, tf: `translateY(${lerp(16, 0, wh.k)}px)` });
  const rb = E.outBack(prog(t, 27.9, 28.3));
  const pulse = Math.exp(-Math.pow((t - 28.75) / 0.14, 2));
  show('remind', { x: 540, y: 1260, o: clamp(prog(t, 27.9, 28.05)), s: lerp(0.8, 1, clamp(rb)) + 0.07 * pulse });
  const rp = prog(t, 28.7, 29.5);
  $('ring').style.width = $('remind').offsetWidth + 'px';
  show('ring', { x: 540, y: 1260, o: rp > 0 && rp < 1 ? (1 - rp) * 0.9 : 0, s: 1 + 0.35 * E.outCubic(rp) });
  const ga = io(t, 28.35, 28.7);
  show('getApp', { x: 540, y: 1385, o: ga.o, blur: ga.blur });
  const tg = io(t, 28.95, 29.45);
  show('tag', { x: 540, y: 1720, o: tg.o, blur: tg.blur });
}

function render(t) {
  for (const id of ['black', 'stopTxt', 'end', 'endLine', 'logo', 'wm', 'title', 'when', 'remind', 'ring', 'getApp', 'tag', 'sup', 'supBand', 'disc', 'split']) hide(id);
  const split = t < T.black;
  $('L').style.display = $('R').style.display = split ? '' : 'none';
  if (split) { scSplit(t); scSupers(t); }
  if (t >= T.black && t < T.endIn + 0.3) scBlack(t);
  if (t >= T.endIn) scEnd(t);
  if (!split) $('stage').style.filter = 'none';
  const f = Math.floor(t * 60);
  $('grain').style.backgroundPosition = `${Math.floor(rnd(f, 2) * 256)}px ${Math.floor(rnd(f, 3) * 256)}px`;
  $('vig').style.display = t >= T.black && t < T.endIn ? 'none' : '';
}

window.DURATION = 30.0;
window.seek = t => render(t);
window.ready = document.fonts.ready.then(() => { build(); render(0); return true; });
if (!navigator.webdriver) {
  window.ready.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); }; loop(); });
}
</script>
</body>
